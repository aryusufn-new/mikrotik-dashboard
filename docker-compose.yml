services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mikrotik-dev-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5051:80"
    networks:
      - shared-db

  backend:
    build: ./backend
    container_name: mikrotik-dev-backend
    restart: unless-stopped
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgresql://mikrotik:${DB_PASSWORD}@mikrotik-db:5432/mikrotik_dev
    networks:
      - shared-db
      - dev-network

  frontend:
    build: ./frontend
    container_name: mikrotik-dev-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - dev-network

networks:
  shared-db:
    external: true
  dev-network:
    driver: bridge
